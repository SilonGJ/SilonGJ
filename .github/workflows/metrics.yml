name: Metrics
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TOKEN }}
          user: SilonGJ
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
